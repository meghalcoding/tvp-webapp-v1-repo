<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Tasty Vadapav — Control Center</title>
<meta name="theme-color" content="#F5F5F7" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icons/icon.svg" />
<link rel="stylesheet" href="css/styles.css" />
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
</head>
<body>

<!-- ==================== LOGIN SCREEN ==================== -->
<div id="login-screen">
  <div class="login-card">
    <div class="signboard">
      <span class="wordmark"><span class="mark-1">TASTY</span> <span class="mark-2">VADAPAV</span></span>
      <span class="tagline">Control Center</span>
    </div>
    <div class="login-body">
      <form id="login-form">
        <div class="field">
          <label for="login-email">Email</label>
          <input id="login-email" type="email" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="login-password">Password</label>
          <input id="login-password" type="password" autocomplete="current-password" required />
        </div>
        <button type="submit" class="btn btn-primary login-submit">Sign in</button>
        <div class="login-error" id="login-error"></div>
      </form>
      <p class="login-helper">
        Accounts are created by the Owner in Supabase Auth. Contact the Owner if you need access.
      </p>
    </div>
  </div>
</div>

<!-- ==================== APP SHELL ==================== -->
<div id="app-shell" class="hidden">

  <aside class="sidebar">
    <div class="signboard">
      <span class="wordmark"><span class="mark-1">TASTY</span><br/><span class="mark-2">VADAPAV</span></span>
      <span class="tagline">Control Center</span>
    </div>
    <nav id="sidebar-nav"></nav>
  </aside>

  <div class="main-col">
    <div id="offline-banner" class="offline-banner hidden">You're offline — entries are queued and will sync automatically.</div>
    <div id="sync-banner" class="sync-banner hidden"></div>

    <header class="topbar">
      <div class="signboard">
        <span class="wordmark"><span class="mark-1">TASTY</span> <span class="mark-2">VADAPAV</span></span>
      </div>
      <button type="button" class="btn btn-ghost mobile-nav-search" id="mobile-nav-search" aria-label="Search menu">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      </button>
      <div class="user-badge" id="topbar-user-badge"></div>
    </header>

    <div class="desktop-only" id="desktop-user-row">
      <div class="user-badge" id="desktop-user-badge"></div>
    </div>

    <main id="screen"></main>
  </div>

  <nav class="bottom-nav" id="bottom-nav"></nav>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
